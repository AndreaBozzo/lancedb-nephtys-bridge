[project]
name = "lancedb-nephtys-bridge"
version = "0.1.0"
description = "Real-time semantic search over NATS event streams, powered by LanceDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.30.1",
    "nats-py>=2.14.0",
    "pydantic>=2.12.5",
    "sentence-transformers>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "W", "C90"]
lint.ignore = ["E501"]